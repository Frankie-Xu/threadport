name: Performance evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Ubuntu Node 24 fixed-capacity benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Measure API and visible browser latency
        run: |
          mkdir -p output/performance
          git rev-parse HEAD > output/performance/source-commit.txt
          node scripts/benchmark.mjs --browser > output/performance/benchmark.json
      - name: Retain evidence including failed budgets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-performance
          path: output/performance/
          if-no-files-found: warn
          retention-days: 14
