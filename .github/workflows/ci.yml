name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, build, tests, and documentation links
        run: npm run check
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Check browser workflows
        run: npm run test:e2e
      - name: Verify isolated package installation
        run: npm run check:pack

  check:
    name: check
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and Node version
        run: test "${{ needs.test.result }}" = "success"
