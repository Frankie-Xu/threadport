name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      THREADPORT_REQUIRE_SQLITE: '1'
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Official public-domain CLI; pin and verify before executing its binaries.
      # https://sqlite.org/download.html publishes the SHA3-256 digest.
      - name: Install verified SQLite CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sqlite-tools-win-x64-3530400.zip'
          $toolsDir = Join-Path $env:RUNNER_TEMP 'threadport-sqlite-3530400'
          Invoke-WebRequest -Uri 'https://sqlite.org/2026/sqlite-tools-win-x64-3530400.zip' -OutFile $archive
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {createHash} from 'node:crypto'; if(createHash('sha3-256').update(readFileSync(process.argv[1])).digest('hex') !== '88b4659fe747896b853af10157316b4ade143553efb89c1c8ca7423a278dcc8b') throw new Error('SQLite archive checksum mismatch');" $archive
          if ($LASTEXITCODE -ne 0) { throw 'SQLite archive verification failed' }
          Expand-Archive -Path $archive -DestinationPath $toolsDir
          $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require real SQLite CLI for exporter coverage
        run: sqlite3 --version
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, build, tests, and documentation links
        run: npm run check
      - name: Cache pinned browser binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Check browser workflows
        run: npm run test:e2e
      - name: Verify isolated package installation
        run: npm run test:package
        env:
          THREADPORT_PACKAGE_OUTPUT: output/package-review
      - name: Retain verified package and checksum evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          path: output/package-review/
          if-no-files-found: error
          retention-days: 14

  check:
    name: check
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and Node version
        run: test "${{ needs.test.result }}" = "success"
