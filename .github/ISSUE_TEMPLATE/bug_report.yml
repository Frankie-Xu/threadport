name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Commands, fixture, or Capsule that show the problem. Do not paste real agent sessions or secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Git SHA, tag, or package version
