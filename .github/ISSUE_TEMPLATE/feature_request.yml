name: Feature request
description: Propose a verifiable increment for the v0.2 task workspace
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who encounters which obstacle while finding, understanding, or continuing a task? Do not include private sessions or secrets.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      value: |
        Task ID:
        Feature / acceptance / regression IDs:
        Included behavior:
        Explicit exclusions:
        Dependencies:
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract and affected files
      description: Link the current specification; describe inputs, outputs, errors, compatibility, and any required ADR. Capsule v1 stays compatible. Log commands must never be executed automatically.
    validations:
      required: true
  - type: textarea
    id: work_packages
    attributes:
      label: Work package delivery map
      description: One independently reviewable package per PR. Include implementation, required tests and documentation together. Record planned values now and actual SHAs/results during delivery.
      value: |
        Work package ID / observable result:
        Upstream packages / downstream consumers:
        Planned commit subject / branch:
        Exact files and responsibilities:
        Test commands / expected behavior:
        Rollback unit / reverse dependency order:
        Data and schema compatibility / post-rollback checks:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      value: |
        - [ ] Observable successful behavior
        - [ ] Key failure and recovery behavior
        - [ ] Relevant tests and manual evidence
        - [ ] User documentation and compatibility notes
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: Delivery
      value: |
        Type / priority (P0–P3):
        Phase / size (S/M/L):
        Owner / target milestone:
        PR:
        Known limitations:
