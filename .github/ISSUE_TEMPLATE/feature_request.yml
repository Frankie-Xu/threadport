name: Feature request
description: Propose a change that stays inside Capsule v1
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would help. Do not assume a schema v2 or MCP server.
    validations:
      required: true
