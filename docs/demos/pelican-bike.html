<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>鹈鹕骑车 · SVG 动画</title>
<style>
  :root{--ink:#18313a;--paper:#f6efe1;--coral:#e86d52;--teal:#277e82;--sun:#f4c95d}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
  .frame{width:min(1100px,94vw);padding:24px 24px 18px;border:2px solid var(--ink);background:#fffaf1;box-shadow:10px 10px 0 var(--ink)}
  header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:12px} h1{font-size:clamp(25px,4vw,46px);line-height:.95;margin:0;letter-spacing:-.06em} .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid var(--coral);padding-bottom:4px}
  .scene{border:2px solid var(--ink);background:#b9e2dd;overflow:hidden} svg{display:block;width:100%;height:auto} .controls{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px}.controls button{border:2px solid var(--ink);background:var(--sun);padding:8px 14px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink)} .controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  @media (prefers-reduced-motion:reduce){.motion{animation-play-state:paused!important}.smil{display:none}}
</style>
</head>
<body>
<main class="frame">
<header><h1>鹈鹕骑自行车</h1><div class="tag">A tiny coastal commute</div></header>
<div class="scene">
<svg viewBox="0 0 1000 560" role="img" aria-label="一只鹈鹕骑着自行车沿海岸前进的2D动画">
 <defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8ed1d2"/><stop offset="1" stop-color="#d7efdf"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#18313a" opacity=".12"/></pattern>
 </defs>
 <rect width="1000" height="560" fill="url(#sky)"/><rect width="1000" height="560" fill="url(#dots)"/>
 <circle cx="855" cy="105" r="54" fill="#f4c95d" stroke="#18313a" stroke-width="5"/>
 <path d="M0 366 Q115 325 235 365 T470 360 T705 367 T1000 350 V560 H0Z" fill="#2d8584" stroke="#18313a" stroke-width="5"/>
 <path d="M0 414 Q130 376 250 414 T500 410 T750 417 T1000 402" fill="none" stroke="#b9e2dd" stroke-width="13" opacity=".8"/>
 <path d="M0 470 Q220 440 420 470 T830 463 T1000 470 V560 H0Z" fill="#e6c783" stroke="#18313a" stroke-width="5"/>
 <g class="motion" style="transform-box:fill-box;transform-origin:center;animation:ride 8s linear infinite">
  <!-- bicycle -->
  <g fill="none" stroke="#18313a" stroke-width="7"><circle cx="360" cy="443" r="67"/><circle cx="650" cy="443" r="67"/><path d="M360 443 L465 350 L540 443 L360 443 M465 350 L650 443 M465 350 L447 327 M430 327h42 M540 443l18-92 M540 351h33"/><circle cx="540" cy="443" r="13" fill="#e86d52"/></g>
  <g stroke="#18313a" stroke-width="5"><path d="M540 443l46 28M540 443l-38 35"/><path d="M345 443h30M360 428v30M635 443h30M650 428v30"/></g>
  <!-- body -->
  <g stroke="#18313a" stroke-width="6" stroke-linejoin="round">
   <path d="M465 288 Q485 230 548 232 Q597 234 615 286 L591 347 Q543 364 483 343Z" fill="#f3f0e5"/>
   <path d="M501 270 Q545 250 581 273 L550 317 Q517 319 489 302Z" fill="#d9ddd2"/>
   <path d="M505 335 L486 405 L518 410 L548 352Z" fill="#f3f0e5"/><path d="M573 337 L598 406 L627 397 L600 324Z" fill="#f3f0e5"/>
   <path d="M483 402 l-5 44 38 0 -1-38Z" fill="#e86d52"/><path d="M597 402 l8 44 36-5 -12-39Z" fill="#e86d52"/>
   <!-- neck/head --> <path d="M533 245 Q512 204 534 150 Q555 111 605 122 Q657 132 659 183 Q660 228 616 250Z" fill="#f3f0e5"/>
   <path d="M588 128 Q613 95 652 111 Q681 123 679 148 Q670 176 642 184Z" fill="#e86d52"/>
   <path d="M674 146 Q734 157 768 189 Q718 210 657 187Z" fill="#f2a36e"/>
   <circle cx="633" cy="143" r="9" fill="#18313a" stroke="none"/><path d="M614 118 Q635 91 662 106" fill="none"/>
  </g>
  <!-- wing flap --> <path class="smil" d="M500 265 Q454 300 463 349 Q497 326 531 283Z" fill="#e86d52" stroke="#18313a" stroke-width="6"><animateTransform attributeName="transform" type="rotate" values="0 510 280;-13 510 280;0 510 280;10 510 280;0 510 280" dur="1.2s" repeatCount="indefinite"/></path>
  <!-- pedal crank --> <circle cx="540" cy="443" r="8" fill="#f4c95d" stroke="#18313a" stroke-width="4"><animateTransform attributeName="transform" type="rotate" from="0 540 443" to="360 540 443" dur="1.2s" repeatCount="indefinite"/></circle>
 </g>
 <g fill="#18313a" font-family="system-ui" font-weight="700"><text x="55" y="90" font-size="22">潮汐线以北 · 07:42</text><text x="55" y="120" font-size="14" opacity=".7">今天也要把风装进翅膀里</text></g>
</svg>
</div>
<div class="controls"><span>纯 SVG 绘制 · 车轮、翅膀与脚踏持续循环</span><button id="toggle" type="button" aria-pressed="false">暂停动画</button></div>
</main>
<script>
  const btn = document.querySelector('#toggle');
  const motion = document.querySelectorAll('.motion');
  const svg = document.querySelector('svg');
  let paused = false;
  btn.addEventListener('click', () => {
    paused = !paused;
    motion.forEach(node => { node.style.animationPlayState = paused ? 'paused' : 'running'; });
    // SVGAnimationElement has no per-node pause() method; pause the document timeline instead.
    if (paused) svg.pauseAnimations(); else svg.unpauseAnimations();
    btn.textContent = paused ? '继续动画' : '暂停动画';
    btn.setAttribute('aria-pressed', String(paused));
  });
</script>
</body></html>
