<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ThreadPort workflow</title>
  <desc id="desc">Three calm, connected cards show discovery, review, and a deliberate handoff.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#F7FAF7"/><stop offset="1" stop-color="#EEF3F1"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6FAF0"/><stop offset="1" stop-color="#AEE5D8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECE7FF"/><stop offset="1" stop-color="#D7CCFF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DCEBFF"/><stop offset="1" stop-color="#C3D8FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#22332F" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#paper)"/><path d="M160 278H1120" stroke="#B8C9C4" stroke-width="2" stroke-dasharray="8 14"/>
  <g filter="url(#shadow)"><rect x="62" y="86" width="344" height="368" rx="24" fill="#FFFFFF" stroke="#D8E3DF"/><rect x="468" y="86" width="344" height="368" rx="24" fill="#FFFFFF" stroke="#D8E3DF"/><rect x="874" y="86" width="344" height="368" rx="24" fill="#FFFFFF" stroke="#D8E3DF"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="132" fill="#2F6F63" font-size="13" font-weight="800" letter-spacing="2.6">01 · DISCOVER</text><text x="96" y="174" fill="#172B2A" font-size="26" font-weight="800">Find the thread</text><text x="96" y="204" fill="#5E706C" font-size="15">Collect local sessions</text><text x="96" y="226" fill="#5E706C" font-size="15">and attach the right task.</text>
    <rect x="96" y="268" width="276" height="120" rx="16" fill="url(#mint)"/><rect x="120" y="294" width="146" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.88"/><rect x="120" y="322" width="202" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.66"/><rect x="120" y="344" width="168" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.52"/><circle cx="336" cy="352" r="17" fill="#2F6F63"/><path d="M329 352L334 357L344 345" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="502" y="132" fill="#6B59C6" font-size="13" font-weight="800" letter-spacing="2.6">02 · REVIEW</text><text x="502" y="174" fill="#172B2A" font-size="26" font-weight="800">Keep it honest</text><text x="502" y="204" fill="#5E706C" font-size="15">Separate evidence, gaps,</text><text x="502" y="226" fill="#5E706C" font-size="15">decisions, and next action.</text>
    <rect x="502" y="268" width="276" height="120" rx="16" fill="url(#violet)"/><rect x="526" y="292" width="86" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.75"/><text x="543" y="305" fill="#6B59C6" font-size="11" font-weight="800">KNOWN</text><rect x="526" y="326" width="178" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.72"/><rect x="526" y="348" width="132" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.52"/><circle cx="746" cy="352" r="17" fill="#6B59C6"/><path d="M739 352L744 357L754 345" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="908" y="132" fill="#3870C6" font-size="13" font-weight="800" letter-spacing="2.6">03 · HANDOFF</text><text x="908" y="174" fill="#172B2A" font-size="26" font-weight="800">Continue by choice</text><text x="908" y="204" fill="#5E706C" font-size="15">Preview the capsule, then</text><text x="908" y="226" fill="#5E706C" font-size="15">confirm once in the terminal.</text>
    <rect x="908" y="268" width="276" height="120" rx="16" fill="url(#blue)"/><rect x="932" y="292" width="202" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.84"/><rect x="932" y="322" width="148" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.64"/><rect x="932" y="344" width="182" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.48"/><circle cx="1148" cy="352" r="17" fill="#3870C6"/><path d="M1141 352L1146 357L1156 345" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="436" cy="278" r="7" fill="#A5B7B2"/><path d="M430 278H442" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="842" cy="278" r="7" fill="#A5B7B2"/><path d="M836 278H848" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>