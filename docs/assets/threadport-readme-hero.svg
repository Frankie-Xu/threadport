<svg width="1440" height="480" viewBox="0 0 1440 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ThreadPort — pick up where the coding agent stopped</title>
  <desc id="desc">A dark graphite hero with a portable context capsule moving from observable work into a deliberate handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#111827"/><stop offset="0.58" stop-color="#18233A"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="route" x1="720" y1="360" x2="1280" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#2DB6A4"/><stop offset="0.52" stop-color="#9A8CFF"/><stop offset="1" stop-color="#B9F2E4"/></linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#49D7C4"/></linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/></pattern>
  </defs>
  <rect width="1440" height="480" rx="28" fill="url(#bg)"/><rect x="26" y="26" width="1388" height="428" rx="22" fill="url(#grid)"/>
  <circle cx="1260" cy="76" r="190" fill="#9A8CFF" fill-opacity="0.08"/><circle cx="820" cy="460" r="210" fill="#2DB6A4" fill-opacity="0.06"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="88" y="92" fill="#A7B4C7" font-size="14" font-weight="800" letter-spacing="3.5">LOCAL · OBSERVE · CONTINUE</text>
    <text x="84" y="178" fill="#F8FAFC" font-size="66" font-weight="800" letter-spacing="-2.5">ThreadPort</text>
    <text x="88" y="224" fill="#D9E3F0" font-size="24" font-weight="550">Pick up where the coding agent stopped.</text>
    <text x="88" y="260" fill="#94A3B8" font-size="17">Find the unfinished task. Review the evidence. Continue deliberately.</text>
  </g>
  <g opacity="0.86">
    <path d="M670 360C804 360 790 218 934 218C1078 218 1078 344 1194 344C1280 344 1270 154 1360 154" stroke="url(#route)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 14"/>
    <path d="M670 360C804 360 790 218 934 218C1078 218 1078 344 1194 344C1280 344 1270 154 1360 154" stroke="url(#route)" stroke-opacity="0.16" stroke-width="18" stroke-linecap="round" filter="url(#softGlow)"/>
  </g>
  <g transform="translate(650 314)"><rect width="188" height="62" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/><circle cx="28" cy="31" r="8" fill="#49D7C4"/><text x="48" y="27" fill="#E2E8F0" font-size="12" font-weight="800" letter-spacing="1.3">DISCOVER</text><text x="48" y="45" fill="#8FA0B6" font-size="12">local sessions</text></g>
  <g transform="translate(878 176)"><rect width="188" height="62" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/><circle cx="28" cy="31" r="8" fill="#A78BFA"/><text x="48" y="27" fill="#E2E8F0" font-size="12" font-weight="800" letter-spacing="1.3">REVIEW</text><text x="48" y="45" fill="#8FA0B6" font-size="12">evidence + gaps</text></g>
  <g transform="translate(1120 312)"><rect width="188" height="62" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/><circle cx="28" cy="31" r="8" fill="#8AE6D3"/><text x="48" y="27" fill="#E2E8F0" font-size="12" font-weight="800" letter-spacing="1.3">HANDOFF</text><text x="48" y="45" fill="#8FA0B6" font-size="12">explicit consent</text></g>
  <g transform="translate(1188 82)"><rect width="186" height="122" rx="22" fill="#0B1220" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.17"/><rect x="20" y="20" width="146" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.10"/><rect x="20" y="48" width="104" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.14"/><rect x="20" y="70" width="128" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.10"/><rect x="20" y="92" width="88" height="9" rx="4.5" fill="url(#capsule)" fill-opacity="0.9"/><circle cx="153" cy="96" r="9" fill="#49D7C4"/><path d="M149 96L152 99L158 92" stroke="#07111C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(1360 154)" filter="url(#softGlow)"><circle r="12" fill="#B9F2E4"/><circle r="4" fill="#FFFFFF"/></g><g transform="translate(934 218)"><circle r="9" fill="#A78BFA" fill-opacity="0.95"/><circle r="3.5" fill="#FFFFFF"/></g><g transform="translate(1194 344)"><circle r="9" fill="#49D7C4" fill-opacity="0.95"/><circle r="3.5" fill="#FFFFFF"/></g>
  <text x="1350" y="420" text-anchor="end" fill="#68778C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">CAPSULE V1 · HUMAN IN THE LOOP</text>
